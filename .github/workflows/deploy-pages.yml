name: Deploy PRISMA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: "Versão para publicar (Phaser = reversão)"
        required: true
        type: choice
        default: godot
        options: [godot, phaser]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Godot
        if: inputs.engine != 'phaser'
        uses: actions/checkout@v4
        with:
          ref: godot-remaster
      - name: Checkout Phaser (rollback)
        if: inputs.engine == 'phaser'
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Godot 4.4.1 and Web template
        if: inputs.engine != 'phaser'
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          curl --fail --location --retry 3 "$release/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$release/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          templates="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$templates"
          unzip -j /tmp/templates.tpz 'templates/web_nothreads_release.zip' -d "$templates"
          test -s "$templates/web_nothreads_release.zip"
          rm /tmp/templates.tpz
      - name: Prepare official and remaster art
        if: inputs.engine != 'phaser'
        run: node godot/tools/prepare-assets.mjs
      - name: Import and export Godot Web
        if: inputs.engine != 'phaser'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --import
          Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/visual_smoke.gd -- --no-save
          Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/world1_smoke.gd -- --no-save
          Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-release Web "$GITHUB_WORKSPACE/dist/index.html"
          for file in index.html index.js index.wasm index.pck; do
            test -s "dist/$file"
          done
          touch dist/.nojekyll
          git rev-parse HEAD > dist/version.txt
          du -sh dist
      - name: Install browser test dependencies
        if: inputs.engine != 'phaser'
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test exported Godot game in Chromium
        if: inputs.engine != 'phaser'
        run: node godot/tools/web-smoke.mjs dist
      - name: Store browser screenshots
        if: always() && inputs.engine != 'phaser'
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-preview
          path: web-*.png
          if-no-files-found: ignore
      - name: Build Phaser rollback
        if: inputs.engine == 'phaser'
        run: |
          npm run test:save
          npm run test:input
          npm run test:levels
          npm run check-levels
          npm run assets
          npm run build
          test -s dist/index.html
          test -s dist/assets/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
