name: Validate Organic Terrain
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/gfx/**'
      - 'src/world/**'
      - 'package.json'
      - 'src/scenes/**'
      - 'src/levels/**'
      - 'assets/raw/w1/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-organic.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:art-geometry
      - run: npm run test:terrain-master
      - run: npm run test:visual-geometry
      - run: npm run test:organic-contours
      - run: npm run test:platform-profile
      - run: npm run test:levels
      - run: npm run check-levels
      - run: npm run build
      - run: test -s dist/studio.html
      - run: npm run art:packs
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-art-packs
          path: .debug/art-packs
          if-no-files-found: error
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run assets
      - name: Capture baseline and organic pilot
        run: |
          npm run shots -- baseline 0,1,2,3
          npm run shots -- organic 0,1,2,3
          npm run shots -- organic-low 0
          node scripts/check-visual-parity.mjs
          node scripts/build-comparison-sheets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prisma-pilot-comparison
          path: .debug/shots
          if-no-files-found: warn
