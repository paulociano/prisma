name: Validate Organic Terrain
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:art-geometry
      - run: npm run test:levels
      - run: npm run check-levels
      - run: npm run build
      - run: test -s dist/studio.html
