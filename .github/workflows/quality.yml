name: Quality
on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:prerender
      - run: npm run test:camera-director
      - run: npm run test:wardrobe
      - run: npm run test:cutscenes
      - run: npm run assets
      - run: node scripts/check-wardrobe-assets.mjs
      - run: node scripts/check-cutscene-assets.mjs
      - run: npm run build
      - run: npm run test:save
      - run: npm run test:input
      - run: npm run test:levels
      - run: npm run check-levels
